# ==============================================================================
# Nginx Reverse Proxy Configuration for FINNY Backend on AWS EC2
# Route: Internet -> HTTPS -> Nginx (80/443) -> FastAPI (127.0.0.1:8001)
# NOTE: Ollama (port 11434) is strictly internal and never exposed to the internet.
# ==============================================================================

# HTTP: Redirect all plain HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_API_DOMAIN>;

    # Allow Let's Encrypt / Certbot challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Terminate TLS and reverse-proxy to FastAPI backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <YOUR_API_DOMAIN>;

    # SSL Certificates (managed via Certbot or AWS ACM / custom certs)
    ssl_certificate /etc/letsencrypt/live/<YOUR_API_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_API_DOMAIN>/privkey.pem;

    # Modern SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum upload size for financial documents (PDFs, Excel, CSV, DOCX)
    client_max_body_size 25M;

    # Gzip compression for API responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # Proxy to FastAPI Uvicorn application on localhost:8001
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for document extraction and Ollama LLM review generation
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering settings for document streaming
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check endpoint explicitly mapped for AWS Application Load Balancer
    location /api/health {
        proxy_pass http://127.0.0.1:8001/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
}
